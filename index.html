<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ukulele Chord Quiz</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100dvh; /* Dynamic viewport height guarantees no cut-offs */
            width: 100%;
            overflow: hidden; /* Prevent vertical scrolling on mobile */
            font-family: 'Nunito', sans-serif; 
            background-color: #f0fdfa;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        .wood-neck { 
            background: linear-gradient(180deg, #4a2c11 0%, #2e1a08 100%); 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .string { 
            background: linear-gradient(90deg, #e2e8f0 0%, #f8fafc 50%, #cbd5e1 100%);
            box-shadow: -2px 0px 4px rgba(0,0,0,0.6); 
        }
        .fret-wire {
            background: linear-gradient(180deg, #94a3b8 0%, #e2e8f0 50%, #64748b 100%);
            box-shadow: 0 2px 3px rgba(0,0,0,0.4);
        }
        .nut {
            background: #fdf6e3;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-teal-200">
    <div id="root" class="h-full w-full max-w-lg mx-auto bg-white shadow-2xl relative overflow-hidden flex flex-col"></div>

    <script type="text/babel">
        const ROOT_MAP = {
            'C':0, 'C#':1, 'DB':1, 'D':2, 'D#':3, 'EB':3, 'E':4, 'F':5, 
            'F#':6, 'GB':6, 'G':7, 'G#':8, 'AB':8, 'A':9, 'A#':10, 'BB':10, 'B':11
        };
        const STRING_ROOTS = [7, 0, 4, 9]; // G, C, E, A
        const STRING_NAMES = ["G", "C", "E", "A"];
        const NUM_FRETS = 5;
        
        // Strict mapping for vertical alignment to ensure UI fits correctly
        const STRING_POS = ['12.5%', '37.5%', '62.5%', '87.5%'];

        function parseChord(chordStr) {
            chordStr = chordStr.trim();
            if(!chordStr) return null;
            
            // Normalize flat/sharp symbols for correct parsing (e.g., bb -> Bb -> BB)
            let rootStr = chordStr.charAt(0).toUpperCase();
            let rest = chordStr.substring(1);
            if (rest.length > 0 && (rest[0] === '#' || rest[0].toLowerCase() === 'b')) {
                rootStr += rest[0].toUpperCase();
                rest = rest.substring(1);
            }
            let rootVal = ROOT_MAP[rootStr];
            if (rootVal === undefined) return null;

            let ints = [];
            const suf = rest;
            if (suf==='' || suf==='maj' || suf==='M' || suf==='Maj') ints = [0,4,7];
            else if (suf==='m' || suf==='min' || suf==='-') ints = [0,3,7];
            else if (suf==='7') ints = [0,4,7,10];
            else if (suf==='m7' || suf==='min7') ints = [0,3,7,10];
            else if (suf==='maj7' || suf==='M7' || suf==='Maj7') ints = [0,4,7,11];
            else if (suf==='dim') ints = [0,3,6];
            else if (suf==='dim7') ints = [0,3,6,9];
            else if (suf==='m7b5') ints = [0,3,6,10];
            else if (suf==='aug' || suf==='+') ints = [0,4,8];
            else if (suf==='sus2') ints = [0,2,7];
            else if (suf==='sus4' || suf==='sus') ints = [0,5,7];
            else if (suf==='6') ints = [0,4,7,9];
            else if (suf==='m6') ints = [0,3,7,9];
            else if (suf==='7sus4') ints = [0,5,7,10];
            else return null;

            let reqPitches = new Set(ints.map(i => (rootVal + i) % 12));
            return { name: chordStr, root: rootVal, reqPitches, is4Note: ints.length >= 4 };
        }

        function checkMatch(fretboard, chord) {
            let playedPitches = new Set();
            for (let s=0; s<4; s++) {
                if(fretboard[s] < 0) continue; 
                playedPitches.add((STRING_ROOTS[s] + fretboard[s]) % 12);
            }
            
            for (let p of playedPitches) {
                if (!chord.reqPitches.has(p)) return false; // Played a wrong note
            }
            
            let missing = [];
            for (let req of chord.reqPitches) {
                if (!playedPitches.has(req)) missing.push(req);
            }
            
            if (missing.length === 0) return true;
            
            // Allow omitting 5th or root for 4-note chords
            if (chord.is4Note && missing.length === 1) {
                let m = missing[0];
                let f5 = (chord.root + 7) % 12;
                if (!chord.reqPitches.has(f5)) f5 = (chord.root + 6) % 12; // Handle flat 5s
                if (m === chord.root || m === f5) return true;
            }
            return false;
        }

        function findAnswers(chord) {
            let answers = [];
            for(let a=0; a<=NUM_FRETS; a++) {
                for(let b=0; b<=NUM_FRETS; b++) {
                    for(let c=0; c<=NUM_FRETS; c++) {
                        for(let d=0; d<=NUM_FRETS; d++) {
                            let f = [a,b,c,d];
                            if(checkMatch(f, chord)) {
                                let cost = a+b+c+d + Math.max(a,b,c,d);
                                answers.push({f, cost});
                            }
                        }
                    }
                }
            }
            answers.sort((x,y) => x.cost - y.cost);
            return answers.map(ans => ans.f);
        }

        const Fretboard = ({ fretboard, targetShape, onFretClick }) => {
            const strings = [0, 1, 2, 3];
            const frets = [1, 2, 3, 4, 5];

            return (
                // Flexible wrapper that grows to fill available space, with sensible min/max constraints
                <div className="w-full max-w-[280px] flex-1 max-h-[360px] min-h-[180px] relative shrink mt-12 mb-8 select-none touch-none">
                    
                    {/* Open Strings Area - Strictly positioned */}
                    <div className="absolute top-[-36px] left-0 w-full h-[36px] z-40">
                        {strings.map(s => (
                            <div key={`open-click-${s}`} 
                                 className="absolute top-0 bottom-0 w-[25%] flex items-center justify-center cursor-pointer transform -translate-x-1/2"
                                 style={{ left: STRING_POS[s] }}
                                 onClick={() => onFretClick(s, 0)}>
                                <div className={`w-5 h-5 rounded-full border-[3px] transition-all duration-200
                                    ${fretboard[s] === 0 ? 'bg-amber-400 border-amber-600 shadow-[0_0_10px_rgba(251,191,36,0.8)]' : 'border-slate-300 bg-white/50 hover:bg-white'}
                                    ${targetShape && targetShape[s] === 0 ? 'ring-4 ring-teal-400 ring-offset-2 bg-teal-100/50' : ''}
                                `}></div>
                            </div>
                        ))}
                    </div>

                    {/* Fretboard Background & Neck */}
                    <div className="absolute inset-0 wood-neck rounded-b-xl border-x-[8px] border-amber-900/80 shadow-2xl overflow-hidden">
                        
                        {/* Nut (Zero Fret) */}
                        <div className="absolute top-0 w-full h-4 nut z-10 border-b-2 border-black/30"></div>
                        
                        {/* Horizontal Fret Wires */}
                        {frets.map(f => (
                            <div key={`fret-${f}`} className="absolute w-full h-[3px] fret-wire z-10" style={{top: `${(f/NUM_FRETS)*100}%`}}></div>
                        ))}
                        
                        {/* Neck Inlay Dots */}
                        <div className="absolute w-4 h-4 rounded-full bg-white/30 top-[50%] left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-0"></div>
                        <div className="absolute w-4 h-4 rounded-full bg-white/30 top-[90%] left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-0"></div>

                        {/* Strings Lines - Strictly positioned */}
                        <div className="absolute inset-0 top-4 bottom-0 z-20">
                            {strings.map((s, i) => (
                                <div key={`string-${s}`} 
                                     className={`absolute top-0 bottom-0 string transform -translate-x-1/2 ${i===0?'w-[2px]':i===1?'w-[3px]':i===2?'w-[2px]':'w-[1px]'}`}
                                     style={{ left: STRING_POS[i] }}></div>
                            ))}
                        </div>

                        {/* Interaction Grid & Markers - Strictly positioned */}
                        <div className="absolute inset-0 top-4 bottom-0 z-30 flex flex-col">
                            {frets.map(f => (
                                <div key={`row-${f}`} className="relative flex-1 w-full border-b border-transparent">
                                    {strings.map(s => (
                                        <div key={`cell-${s}-${f}`} 
                                             className="absolute top-0 bottom-0 w-[25%] flex items-center justify-center cursor-pointer transform -translate-x-1/2 hover:bg-white/5 active:bg-white/10"
                                             style={{ left: STRING_POS[s] }}
                                             onClick={() => onFretClick(s, f)}>
                                             {/* Target Marker (Answer) */}
                                             {targetShape && targetShape[s] === f && (
                                                <div className="absolute w-8 h-8 rounded-full border-[3px] border-teal-300 shadow-[0_0_15px_rgba(45,212,191,0.8)] bg-teal-400/20 pointer-events-none animate-pulse"></div>
                                             )}
                                             {/* User Marker */}
                                             {fretboard[s] === f && (
                                                <div className="absolute w-7 h-7 rounded-full bg-amber-400 border-[2px] border-amber-600 shadow-[inset_0_-2px_4px_rgba(0,0,0,0.5),_0_2px_6px_rgba(0,0,0,0.6)] pointer-events-none transform transition-transform duration-100"></div>
                                             )}
                                        </div>
                                    ))}
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    {/* String Labels - Strictly positioned */}
                    <div className="absolute bottom-[-32px] left-0 w-full h-[32px] z-40 text-slate-400 font-extrabold text-sm tracking-wider">
                        {STRING_NAMES.map((name, i) => (
                            <div key={`label-${i}`} 
                                 className="absolute top-0 bottom-0 w-[25%] flex items-center justify-center transform -translate-x-1/2"
                                 style={{ left: STRING_POS[i] }}>
                                {name}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [gameState, setGameState] = React.useState('SETUP'); 
            const [chordInput, setChordInput] = React.useState('C, F, G, Am, Dm, G7');
            const [setupError, setSetupError] = React.useState('');
            const [chords, setChords] = React.useState([]);
            
            const [currentChordIdx, setCurrentChordIdx] = React.useState(0);
            const [fretboard, setFretboard] = React.useState([0,0,0,0]);
            
            const [quizState, setQuizState] = React.useState('PLAYING'); 
            const [message, setMessage] = React.useState('Tap frets to build the chord');
            const [answers, setAnswers] = React.useState([]);
            const [answerIdx, setAnswerIdx] = React.useState(0);

            const [stats, setStats] = React.useState({});
            const [totalPlayed, setTotalPlayed] = React.useState(0);
            const [totalCorrect, setTotalCorrect] = React.useState(0);

            // Load saved chords from localStorage on mount
            React.useEffect(() => {
                const saved = localStorage.getItem('ukulele_chords');
                if (saved) {
                    setChordInput(saved);
                }
            }, []);

            const handleStart = () => {
                setSetupError('');
                const parts = chordInput.split(',').map(s => s.trim()).filter(s => s);
                let validChords = [];
                let bad = [];
                
                parts.forEach(p => {
                    const parsed = parseChord(p);
                    if(parsed) validChords.push(parsed);
                    else bad.push(p);
                });

                if(bad.length > 0) {
                    setSetupError("Unknown chord(s): " + bad.join(', '));
                    return;
                }
                if(validChords.length === 0) {
                    setSetupError("Please enter at least one valid chord.");
                    return;
                }

                // Save to localStorage
                localStorage.setItem('ukulele_chords', chordInput);

                let initStats = {};
                validChords.forEach(c => {
                    initStats[c.name] = { attempts: 0, correct: 0 };
                });

                setChords(validChords);
                setStats(initStats);
                setTotalPlayed(0);
                setTotalCorrect(0);
                setGameState('QUIZ');
                pickNextChord(validChords);
            };

            const pickNextChord = (chordList = chords) => {
                const len = chordList.length;
                let nextIdx = Math.floor(Math.random() * len);
                if (len > 1 && nextIdx === currentChordIdx) {
                    nextIdx = (nextIdx + 1) % len;
                }
                setCurrentChordIdx(nextIdx);
                setFretboard([0,0,0,0]);
                setQuizState('PLAYING');
                setMessage('Tap frets to build the chord');
                setAnswers([]);
                setAnswerIdx(0);
            };

            const handleFretClick = (stringIdx, fretIdx) => {
                if(quizState !== 'PLAYING') return;
                let newFretboard = [...fretboard];
                if (newFretboard[stringIdx] === fretIdx) {
                    newFretboard[stringIdx] = 0; 
                } else {
                    newFretboard[stringIdx] = fretIdx;
                }
                setFretboard(newFretboard);
            };

            const handleCheck = () => {
                const chord = chords[currentChordIdx];
                const isMatch = checkMatch(fretboard, chord);
                
                let newStats = { ...stats };
                newStats[chord.name].attempts += 1;
                
                setTotalPlayed(prev => prev + 1);

                const validShapes = findAnswers(chord);
                setAnswers(validShapes);
                setAnswerIdx(0);

                if (isMatch) {
                    newStats[chord.name].correct += 1;
                    setTotalCorrect(prev => prev + 1);
                    setMessage('Correct! 🎉');
                    setQuizState('CHECKED');
                } else {
                    setMessage('Incorrect. Shape shown in teal.');
                    setQuizState('SHOWING_ANSWER');
                }
                
                setStats(newStats);
            };

            const handleShowAnswer = () => {
                if (quizState === 'PLAYING') {
                    const chord = chords[currentChordIdx];
                    let newStats = { ...stats };
                    newStats[chord.name].attempts += 1;
                    setTotalPlayed(prev => prev + 1);
                    setStats(newStats);

                    const validShapes = findAnswers(chord);
                    setAnswers(validShapes);
                    setAnswerIdx(0);
                    setMessage('Answer shown in teal.');
                    setQuizState('SHOWING_ANSWER');
                } else if (answers.length > 0) {
                    const nextIdx = (answerIdx + 1) % answers.length;
                    setAnswerIdx(nextIdx);
                    setMessage(`Shape ${nextIdx + 1} of ${answers.length}`);
                }
            };

            if (gameState === 'SETUP') {
                return (
                    <div className="h-full w-full flex flex-col p-6 bg-gradient-to-br from-teal-50 to-teal-100 overflow-y-auto">
                        <div className="flex-grow flex flex-col justify-center">
                            <div className="bg-white rounded-3xl shadow-xl p-8 border border-teal-100">
                                <div className="w-16 h-16 bg-teal-500 text-white rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg rotate-3">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                      <path strokeLinecap="round" strokeLinejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                                    </svg>
                                </div>
                                <h1 className="text-3xl font-black text-slate-800 mb-2 text-center tracking-tight">Ukulele Quiz</h1>
                                <p className="text-slate-500 text-center mb-8 font-medium">Standard GCEA tuning. Master your shapes.</p>
                                
                                <label className="block text-sm font-bold text-slate-700 mb-2 ml-1">Chords to practice</label>
                                <textarea 
                                    className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-teal-500 focus:ring-0 text-lg mb-2 shadow-inner transition-colors"
                                    rows="3"
                                    value={chordInput}
                                    onChange={e => setChordInput(e.target.value)}
                                    placeholder="e.g. C, F, G, Am, Bb"
                                ></textarea>
                                
                                {setupError && (
                                    <div className="text-rose-500 text-sm font-bold mb-4 bg-rose-50 p-3 rounded-lg border border-rose-100">
                                        {setupError}
                                    </div>
                                )}
                                
                                <button 
                                    onClick={handleStart}
                                    className="w-full mt-4 bg-teal-500 hover:bg-teal-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-teal-500/30 transition-all transform active:scale-95 text-lg"
                                >
                                    Start Playing
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (gameState === 'SUMMARY') {
                const pct = totalPlayed > 0 ? Math.round((totalCorrect / totalPlayed) * 100) : 0;
                return (
                    <div className="h-full w-full flex flex-col bg-slate-50 p-6 overflow-y-auto">
                        <div className="bg-white rounded-3xl shadow-xl p-6 border border-slate-100 mt-4">
                            <h2 className="text-2xl font-black text-center mb-6 text-slate-800">Quiz Results</h2>
                            
                            <div className="flex justify-center items-center gap-6 mb-8">
                                <div className="text-center">
                                    <div className="text-5xl font-black text-teal-500 mb-1">{pct}%</div>
                                    <div className="text-slate-500 text-sm font-bold uppercase tracking-wider">Accuracy</div>
                                </div>
                                <div className="h-12 w-px bg-slate-200"></div>
                                <div className="text-center">
                                    <div className="text-4xl font-black text-slate-700 mb-1">{totalCorrect}<span className="text-xl text-slate-400">/{totalPlayed}</span></div>
                                    <div className="text-slate-500 text-sm font-bold uppercase tracking-wider">Score</div>
                                </div>
                            </div>

                            <div className="space-y-3 mb-8">
                                {Object.entries(stats).map(([name, data]) => {
                                    if(data.attempts === 0) return null;
                                    const p = Math.round((data.correct / data.attempts) * 100);
                                    return (
                                        <div key={name} className="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                            <span className="font-black text-xl text-slate-700 w-16">{name}</span>
                                            <div className="flex-grow bg-slate-200 h-3 mx-4 rounded-full overflow-hidden">
                                                <div className="bg-teal-500 h-full rounded-full" style={{width: `${p}%`}}></div>
                                            </div>
                                            <span className="text-slate-600 font-bold whitespace-nowrap">{data.correct}/{data.attempts}</span>
                                        </div>
                                    );
                                })}
                            </div>

                            <button 
                                onClick={() => setGameState('SETUP')}
                                className="w-full bg-slate-800 hover:bg-slate-900 text-white font-black py-4 rounded-2xl shadow-lg transition-all transform active:scale-95 text-lg"
                            >
                                Practice Again
                            </button>
                        </div>
                    </div>
                );
            }

            const currentChord = chords[currentChordIdx];
            const pct = totalPlayed > 0 ? Math.round((totalCorrect / totalPlayed) * 100) : 0;

            return (
                <div className="h-full w-full flex flex-col relative bg-white overflow-hidden">
                    {/* Header Top Bar (flex-none avoids compression) */}
                    <div className="w-full flex-none flex justify-between items-center px-5 py-3 bg-slate-800 text-white z-10 shadow-md">
                        <div className="flex flex-col">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Score</span>
                            <span className="font-black text-lg leading-tight">{totalCorrect}/{totalPlayed} <span className="text-teal-400">({pct}%)</span></span>
                        </div>
                        <button 
                            onClick={() => setGameState('SUMMARY')}
                            className="bg-slate-700 hover:bg-rose-500 px-4 py-2 rounded-xl text-sm font-bold transition-colors active:scale-95"
                        >
                            Quit
                        </button>
                    </div>

                    {/* Question Prompt (flex-none avoids compression) */}
                    <div className="w-full flex-none text-center pt-5 pb-2 bg-slate-50 border-b border-slate-200 shadow-sm z-0">
                        <div className="text-slate-400 uppercase tracking-widest text-xs font-black mb-1">Play this chord</div>
                        <div className="text-6xl font-black text-slate-800 tracking-tighter drop-shadow-sm">{currentChord.name}</div>
                    </div>

                    {/* Interactive Fretboard Area (flex-1 dynamically shrinks/grows to fit remaining space) */}
                    <div className="flex-1 min-h-0 w-full flex flex-col items-center justify-center bg-gradient-to-b from-slate-50 to-slate-100 relative px-4">
                        <Fretboard 
                            fretboard={fretboard} 
                            targetShape={quizState !== 'PLAYING' && answers.length > 0 ? answers[answerIdx] : null}
                            onFretClick={handleFretClick}
                        />

                        {/* Status Message Area */}
                        <div className={`flex-none text-center font-bold text-lg h-8 mt-2 transition-colors duration-300
                            ${quizState === 'CHECKED' ? 'text-teal-600 drop-shadow-sm' : ''}
                            ${quizState === 'SHOWING_ANSWER' ? 'text-amber-600' : ''}
                            ${quizState === 'PLAYING' ? 'text-slate-400' : ''}
                        `}>
                            {message}
                        </div>
                    </div>

                    {/* Control Buttons (flex-none to maintain size at the bottom) */}
                    <div className="w-full flex-none p-4 grid grid-cols-3 gap-3 bg-white border-t border-slate-200 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.1)] z-10 pb-6">
                        {quizState === 'PLAYING' ? (
                            <>
                                <button onClick={() => setFretboard([0,0,0,0])} className="bg-slate-100 hover:bg-slate-200 text-slate-600 font-black py-4 rounded-2xl transition-all active:scale-95 border border-slate-200">Clear</button>
                                <button onClick={handleCheck} className="col-span-1 bg-slate-800 hover:bg-slate-900 text-white font-black py-4 rounded-2xl transition-all shadow-lg active:scale-95 border-b-4 border-slate-900 active:border-b-0 active:translate-y-1">Check</button>
                                <button onClick={handleShowAnswer} className="bg-amber-100 hover:bg-amber-200 text-amber-700 font-black py-4 rounded-2xl transition-all active:scale-95 border border-amber-200">Show</button>
                            </>
                        ) : (
                            <>
                                <button onClick={() => pickNextChord()} className="col-span-2 bg-teal-500 hover:bg-teal-600 text-white font-black py-4 rounded-2xl transition-all shadow-lg shadow-teal-500/20 active:scale-95 border-b-4 border-teal-700 active:border-b-0 active:translate-y-1 text-lg">Next Chord</button>
                                <button onClick={handleShowAnswer} disabled={answers.length <= 1} className="bg-slate-100 hover:bg-slate-200 disabled:opacity-40 disabled:cursor-not-allowed text-slate-700 font-black py-4 rounded-2xl transition-all active:scale-95 border border-slate-200">More</button>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
